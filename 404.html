<!DOCTYPE html>
<html lang="en-GB" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — TechJam</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; color: var(--dark-text); background: var(--dark-bg); position: relative; overflow: hidden; isolation: isolate; padding: 2rem; }
    .nf__bg { position: absolute; inset: 0; z-index: -1; background: var(--grad-hero); background-size: 200% 200%; animation: gradShift 18s ease infinite; }
    .nf h1 { font-size: clamp(4rem, 16vw, 9rem); }
    .nf p { color: var(--dark-muted); font-size: var(--fs-lead); margin: .5rem 0 2rem; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="nf__bg" aria-hidden="true"></div>
    <div>
      <p class="eyebrow eyebrow--bracket eyebrow--light">TechJam</p>
      <h1 class="grad-text">404</h1>
      <p>That page wandered off. Let's get you back on track.</p>
      <a class="btn btn-on-dark btn-lg" href="index.html">Back to home</a>
    </div>
  </main>
</body>
</html>
